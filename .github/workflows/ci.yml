name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun --bun ./node_modules/@playwright/test/cli.js install --with-deps chromium
      # Each viewport gets fresh server state and its own real request budget.
      - run: bun run test:e2e --project=${{ matrix.project }}
        env:
          ENABLE_ACCOUNTS: 'false'
          VITE_BACKEND_URL: ''
      # The required viewport gate also covers persistent accounts and earned rewards.
      # Each matrix job owns a disposable local PostgreSQL and fresh player servers.
      - run: bun run db:test:up
      - run: bun run test:e2e:player --project=${{ matrix.project }}
        env:
          VITE_BACKEND_URL: ''
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
