name: Feature proposal
description: Propose a change for maintainer discussion before implementation.
title: "FEAT: "
labels: [enhancement, "status:proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the player or contributor need before proposing implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include what is outside this proposal and any gameplay/privacy impact.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable outcomes and validation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and dependencies
      description: Link related issues and explain tradeoffs. A milestone does not authorize implementation.
