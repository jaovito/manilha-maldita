name: truco

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: truco_dev
      POSTGRES_USER: truco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truco_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truco -d truco_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:18.6-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: truco_test
      POSTGRES_USER: truco_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-truco_test_local}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truco_test -d truco_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
